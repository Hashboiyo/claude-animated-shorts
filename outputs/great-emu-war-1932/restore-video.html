<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restore the Great Emu War short</title>
<style>body{font:17px/1.6 system-ui,sans-serif;background:#f5f1e8;color:#232a29;max-width:680px;margin:8vh auto;padding:24px}h1{font-size:32px;line-height:1.2}button{font:inherit;background:#254c40;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{display:block;margin:24px 0}#status{white-space:pre-wrap}video{width:100%;margin-top:24px;border-radius:12px}small{color:#59635d}</style>
<h1>The Great Emu War of 1932</h1><p>Select both video part files from this folder, then verify and save the completed MP4.</p>
<input type="file" id="files" multiple accept=".part001,.part002"><button id="join">Verify and save MP4</button><p id="status" role="status"></p><small>Runs entirely on your device. No uploads or network requests. Concatenation preserves the original video bytes.</small><video id="preview" controls hidden></video>
<script>
const expectedSize=143278887,expectedHash='8ece1c732f0ac5380971c67ee95d38ee0ae0cae18a00c361f1e4fe850cae3c92';
const names=['great-emu-war-1932.mp4.part001','great-emu-war-1932.mp4.part002'];
const status=document.querySelector('#status'),button=document.querySelector('#join');let currentURL;
button.onclick=async()=>{try{const files=[...document.querySelector('#files').files];const parts=names.map(n=>files.find(f=>f.name===n));if(parts.some(f=>!f))throw Error('Select both .part001 and .part002 files.');button.disabled=true;status.textContent='Verifying the original file checksum…';const blob=new Blob(parts,{type:'video/mp4'});if(blob.size!==expectedSize)throw Error('The selected parts have the wrong total size.');if(!crypto.subtle)throw Error('This browser cannot verify local files. Use the included Python helper instead.');const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))].map(b=>b.toString(16).padStart(2,'0')).join('');if(hash!==expectedHash)throw Error('Checksum mismatch. Download both parts again.');if(currentURL)URL.revokeObjectURL(currentURL);currentURL=URL.createObjectURL(blob);const a=document.createElement('a');a.href=currentURL;a.download='great-emu-war-1932.mp4';a.click();const preview=document.querySelector('#preview');preview.src=currentURL;preview.hidden=false;status.textContent='Verified. The original 66-second MP4 is ready to save and play.';}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};
</script></html>
